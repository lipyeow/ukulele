# Tool settings for scripts/. Run `make lint` (ruff) and `make typecheck` (pyrefly).
# Both are pinned in the Makefile.
# This isn't an installable package: the scripts are run directly with python3.

[tool.ruff]
# The scripts still run on the system Python 3.7, so ruff mustn't suggest newer syntax.
target-version = "py37"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
# Every rule, preview ones included; each exception below says why.
select = ["ALL"]
preview = true
ignore = [
    # Conflict with `ruff format`, as ruff's docs warn.
    "COM812",
    # Incompatible pairs: keep D211 (no blank line before a class docstring) and D212
    # (summary on the docstring's first line).
    "D203",
    "D213",
    # Docstrings use Google-style sections (Args:, Returns:), which don't end in a blank line.
    "D413",
    # The scripts are command-line tools: printing is how they report.
    "T201",
    # The repo is CC0 (see LICENSE): no per-file copyright notices.
    "CPY001",
    # scripts/ is a folder of standalone scripts, not a package.
    "INP001",
]

[tool.pyrefly]
project-includes = ["scripts"]
search-path = ["scripts"]
python-version = "3.7"
# Every error kind; each one turned off below says why.
preset = "all"

[tool.pyrefly.errors]
# Truthiness (`if text:`) is idiomatic, and ruff's PLC1901 asks for it over `text == ""`.
implicit-bool = false
# Calls like Path.write_text and subprocess.run return values these scripts don't need.
unused-call-result = false
# YAML and CSV data is untyped: Any is the honest type for it (see Hymn in repos.py).
explicit-any = false
